<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conexión establecida</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #dceee5, #f4f7f2);
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.9);

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .wifi {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .loading {
            font-size: 15px;
            color: #777;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #315c4c;
        }

        .message {
            font-size: 22px;
            line-height: 1.5;
            font-weight: bold;
            color: #263d35;
        }

        .verse {
            margin-top: 25px;
            font-size: 15px;
            line-height: 1.6;
            color: #666;
        }

        .heart {
            margin-top: 25px;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="wifi">📶</div>

        <div class="loading">
            CONEXIÓN ESTABLECIDA
        </div>

        <h1>✓ CONECTADO</h1>

        <div class="message">
            La única conexión que realmente necesitas es con Dios.
        </div>

        <div class="verse">
            “Acercaos a Dios, y él se acercará a vosotros.”
            <br>
            <strong>Santiago 4:8</strong>
        </div>

        <div class="heart">♡</div>

    </div>

</body>
</html>
